version: '3.9'

networks:
  ason-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.1.1.0/24

volumes:
  mongodb_data:

services:
  ason:
    build: .
    container_name: ason
    env_file:
      - .env
    ports:
      - '5100:5100'
    volumes:
      - ../ASON-CORE-SERVICE:/app/ason-core-service
    networks:
      - ason-network
    depends_on:
      - mongodb
      - redis
      - elasticsearch
      - kibana
      - rabbitmq

  elasticsearch:
    image: elasticsearch:7.9.2
    container_name: elasticsearch
    restart: always
    environment:
      ES_JAVA_OPTS: -Xms1024m -Xmx1024m
      discovery.type: single-node
    ports:
      - '9200:9200'
      - '9300:9300'
    networks:
      - ason-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9200']
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: kibana:7.9.2
    container_name: kibana
    restart: always
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - '5601:5601'
    depends_on:
      - elasticsearch
    networks:
      - ason-network

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - '6379:6379'
    networks:
      - ason-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - ason-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - '27017:27017'
    networks:
      - ason-network
    volumes:
      - mongodb_data:/data/db
  
  mongodb-express:
    image: mongo-express:latest
    container_name: mongodb-express
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
    ports:
      - '8081:8081'
    networks:
      - ason-network
    depends_on:
      - mongodb

