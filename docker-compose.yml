version: '3.9'

networks:
  elk-stack:
    driver: bridge
    ipam:
      config:
        - subnet: 172.1.1.0/24

volumes:
  mongo_data:

services:
  node-app:
    build: .
    container_name: ason-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongo:27017/InsoAi
    ports:
      - '5000:5000'
    networks:
      - elk-stack
    depends_on:
      - elasticsearch
      - redis
      - mongo

  elasticsearch:
    image: elasticsearch:7.9.2
    container_name: elasticsearch
    restart: always
    environment:
      ES_JAVA_OPTS: -Xms1024m -Xmx1024m
      discovery.type: single-node
    ports:
      - '9200:9200'
      - '9300:9300'
    networks:
      - elk-stack
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9200']
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: kibana:7.9.2
    container_name: kibana
    restart: always
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - '5601:5601'
    depends_on:
      - elasticsearch
    networks:
      - elk-stack

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - '3000:3000'
    depends_on:
      - elasticsearch
    networks:
      - elk-stack

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - '6379:6379'
    networks:
      - elk-stack

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - elk-stack

  mongo:
    image: mongo:latest
    container_name: mongo
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - elk-stack
